<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="55%" stop-color="#0b1220"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22d3ee">
      <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#34d399;#22d3ee" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#8b5cf6">
      <animate attributeName="stop-color" values="#8b5cf6;#34d399;#22d3ee;#8b5cf6" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <radialGradient id="glow" cx="35%" cy="25%" r="80%">
    <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="avatarClip"><circle cx="220" cy="250" r="112"/></clipPath>
  <style>
    .mono{font-family:'Courier New',Consolas,monospace}.ui{font-family:Inter,Segoe UI,Arial,sans-serif}
    .muted{fill:#94a3b8}.text{fill:#e5e7eb}.key{fill:#38bdf8;font-weight:700}.val{fill:#f8fafc}.green{fill:#34d399}.violet{fill:#a78bfa}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.head{font-size:18px;font-weight:700}.title{font-size:28px;font-weight:800}
  </style>
</defs>

